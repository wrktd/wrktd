<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#F2EDE4"/>
  <!-- Bold diagonal blocks -->
  <polygon points="0,0 600,0 600,180 0,420" fill="#1A1A2E"/>
  <polygon points="0,420 600,180 600,600 0,600" fill="#0F2952"/>
  <!-- Central graphic: stacked bold type-mark feel -->
  <rect x="200" y="230" width="200" height="12" fill="#B89A4E"/>
  <rect x="240" y="258" width="120" height="12" fill="#B89A4E"/>
  <rect x="220" y="286" width="160" height="12" fill="#B89A4E"/>
  <!-- Bold outer ring -->
  <circle cx="300" cy="270" r="130" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.9"/>
  <circle cx="300" cy="270" r="106" fill="none" stroke="#B89A4E" stroke-width="5" opacity="0.7"/>
  <!-- Corner accents -->
  <rect x="30" y="30" width="50" height="6" fill="#B89A4E"/>
  <rect x="30" y="30" width="6" height="50" fill="#B89A4E"/>
  <rect x="520" y="30" width="50" height="6" fill="#B89A4E"/>
  <rect x="564" y="30" width="6" height="50" fill="#B89A4E"/>
  <rect x="30" y="564" width="50" height="6" fill="#B89A4E"/>
  <rect x="30" y="520" width="6" height="50" fill="#B89A4E"/>
  <rect x="520" y="564" width="50" height="6" fill="#B89A4E"/>
  <rect x="564" y="520" width="6" height="50" fill="#B89A4E"/>
</svg>
